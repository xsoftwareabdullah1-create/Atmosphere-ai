<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Atmosphere AI</title>
<style>
  :root { --bg:#1a1a1a; --surface:#2d2d2d; --text:#e8e8e8; --accent:#d97757; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--text); display:flex; height:100vh; }
  .sidebar { width:260px; background:#141414; padding:16px; border-right:1px solid #333; display:flex; flex-direction:column; gap:8px; }
  .sidebar h1 { font-size:16px; margin:0 0 12px; color:var(--accent); }
  .sidebar button { background:var(--surface); color:var(--text); border:1px solid #444; padding:8px; border-radius:6px; cursor:pointer; text-align:left; }
  .sidebar button:hover { border-color:var(--accent); }
  .main { flex:1; display:flex; flex-direction:column; max-width:900px; margin:0 auto; width:100%; }
  .chat-area { flex:1; overflow-y:auto; padding:24px; }
  .message { margin-bottom:20px; line-height:1.6; }
  .message.user { text-align:right; }
  .message.user .bubble { background:var(--surface); display:inline-block; padding:12px 16px; border-radius:12px; max-width:80%; text-align:left; }
  .message.assistant .bubble { background:transparent; }
  .input-area { padding:16px 24px; border-top:1px solid #333; }
  textarea { width:100%; background:var(--surface); border:1px solid #444; border-radius:8px; color:var(--text); padding:12px; font:inherit; resize:none; min-height:60px; }
  textarea:focus { outline:1px solid var(--accent); }
  .controls { display:flex; justify-content:space-between; align-items:center; margin-top:8px; }
  .attach-btn { cursor:pointer; color:var(--accent); font-size:14px; }
  button.send { background:var(--accent); color:#fff; border:none; padding:10px 20px; border-radius:6px; cursor:pointer; font-weight:500; }
  button.send:disabled { opacity:.5; cursor:not-allowed; }
  pre { background:#0d0d0d; padding:16px; border-radius:8px; overflow-x:auto; }
  code { font-family:'SF Mono',Monaco,monospace; font-size:13px; }
  .attachments { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:8px; }
  .chip { background:var(--surface); border:1px solid #444; border-radius:6px; padding:6px 10px; font-size:13px; display:flex; align-items:center; gap:8px; }
  .chip button { background:none; border:none; color:#999; cursor:pointer; font-size:16px; padding:0; }
</style>
</head>
<body>
<aside class="sidebar">
  <h1>Atmosphere AI</h1>
  <button onclick="newChat()">+ New Chat</button>
  <button onclick="connectGitHub()">🔗 Connect GitHub</button>
  <div style="font-size:12px;color:#888;margin-top:8px">Supports PDF, images, code, ZIP &amp; more</div>
</aside>

<div class="main">
  <div class="chat-area" id="chat"></div>
  <div class="input-area">
    <div class="attachments" id="attachments"></div>
    <textarea id="input" placeholder="Ask Atmosphere to code, analyze files, or edit your repo..." rows="2"></textarea>
    <div class="controls">
      <label class="attach-btn">📎 Attach files
        <input type="file" id="file-input" multiple style="display:none"
          accept=".pdf,.png,.jpg,.jpeg,.gif,.webp,.docx,.xlsx,.pptx,.mp3,.wav,.flac,.ogg,.txt,.md,.csv,.json,.zip,.js,.ts,.py,.java,.go,.rs,.c,.cpp,.html,.css" />
      </label>
      <button class="send" id="send" onclick="sendMessage()">Send</button>
    </div>
  </div>
</div>

<script>
let messages = [];
let pendingAttachments = [];
let githubToken = new URLSearchParams(location.search).get('github_token') || null;
let isLoading = false;

if (githubToken) {
  history.replaceState({}, '', '/');
  localStorage.setItem('gh_token', githubToken);
} else {
  githubToken = localStorage.getItem('gh_token');
}

function connectGitHub() { location.href = '/auth/github'; }

function escapeHtml(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function formatContent(t){
  return t.replace(/```(\w*)\n?([\s\S]*?)```/g,(_,l,c)=>`<pre><code>${escapeHtml(c.trim())}</code></pre>`)
          .replace(/\n/g,'<br>');
}

function addMessage(role, content) {
  messages.push({ role, content });
  const chat = document.getElementById('chat');
  const div = document.createElement('div');
  div.className = `message ${role}`;
  const inner = role === 'user' ? escapeHtml(content) : formatContent(content);
  div.innerHTML = `<div class="bubble">${inner}</div>`;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

document.getElementById('file-input').addEventListener('change', async (e) => {
  for (const file of e.target.files) {
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.innerHTML = `<span>${file.name}</span><span style="color:#999">uploading…</span>`;
    document.getElementById('attachments').appendChild(chip);

    const form = new FormData();
    form.append('file', file);
    try {
      const r = await fetch('/api/upload', { method: 'POST', body: form });
      const data = await r.json();
      if (data.zip && data.files) {
        chip.innerHTML = `<span>📦 ${file.name} (${data.extracted} files)</span>`;
        data.files.forEach(f => pendingAttachments.push(f));
      } else if (data.file_id) {
        chip.innerHTML = `<span>${file.name}</span>`;
        pendingAttachments.push({ filename: file.name, fileId: data.file_id });
      } else {
        chip.innerHTML = `<span>${file.name} — failed</span>`;
      }
    } catch {
      chip.innerHTML = `<span>${file.name} — failed</span>`;
    }
  }
  e.target.value = '';
});

async function sendMessage() {
  if (isLoading) return;
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text && pendingAttachments.length === 0) return;

  input.value = '';
  addMessage('user', text || '(attached files)');
  const fileIds = pendingAttachments.map(a => a.fileId);
  pendingAttachments = [];
  document.getElementById('attachments').innerHTML = '';

  isLoading = true;
  document.getElementById('send').disabled = true;

  const chat = document.getElementById('chat');
  const ph = document.createElement('div');
  ph.className = 'message assistant';
  ph.innerHTML = '<div class="bubble">Thinking…</div>';
  chat.appendChild(ph);
  chat.scrollTop = chat.scrollHeight;

  try {
    const r = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages, file_ids: fileIds })
    });
    const data = await r.json();
    ph.remove();
    addMessage('assistant', data.content || data.error || 'No response');
  } catch (err) {
    ph.remove();
    addMessage('assistant', 'Error: ' + err.message);
  }
  isLoading = false;
  document.getElementById('send').disabled = false;
}

function newChat() {
  messages = [];
  pendingAttachments = [];
  document.getElementById('chat').innerHTML = '';
  document.getElementById('attachments').innerHTML = '';
}

document.getElementById('input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
</script>
</body>
      </html>
